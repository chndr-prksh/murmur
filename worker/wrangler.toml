name = "murmur-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Create with: npx wrangler kv namespace create FORECASTS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "FORECASTS"
id = "90845ca75d3a4e14ae3ffd7b92ed2ed7"

[vars]
# Comma-separated origins allowed to call the API (your GitHub Pages URL, plus local dev).
ALLOWED_ORIGINS = "https://chndr-prksh.github.io,http://localhost:4173"
# New questions each visitor may ask per day.
DAILY_LIMIT = "5"
# Independent forecaster samples averaged per question.
SAMPLES = "3"
# Base URL of a running laya-serve instance (https://github.com/NandhaKishorM/laya).
# Leave empty to skip evidence scoring. If the server needs a key:
#   npx wrangler secret put LAYA_API_KEY
LAYA_URL = ""

# The API key is a secret, never a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
